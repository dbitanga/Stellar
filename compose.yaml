name: stellar

services:
  mysql:
    image: mysql:8.4
    pull_policy: never
    container_name: stellar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: stellar_db
      MYSQL_USER: stellar
      MYSQL_PASSWORD: stellar_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - stellar-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    pull_policy: never
    container_name: stellar-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stellar-network

volumes:
  mysql-data:
    name: stellar-volume

networks:
  stellar-network:
    name: stellar-network