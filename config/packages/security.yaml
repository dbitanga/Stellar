security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        ROLE_ADMIN: ROLE_STAFF

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                # Used when the login wasn't triggered by a protected page; sends staff to the dashboard and customers to the store.
                default_target_path: app_after_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true

    # Note: Only the *first* matching rule is applied. Pages not listed (the store, login, sign-up) are public.
    # Admin-only areas are also guarded by #[IsGranted] on their controllers and hidden from the menu with is_granted().
    access_control:
        - { path: ^/dashboard$, roles: ROLE_ADMIN }
        - { path: ^/dashboard/(user|customer|payment), roles: ROLE_ADMIN }
        - { path: ^/dashboard/order/\d+/(pay|refund), roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_STAFF }
        - { path: ^/(cart|account), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
